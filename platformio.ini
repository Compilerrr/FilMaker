[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	gyverlibs/EncButton@^3.7.3
	waspinator/AccelStepper@^1.64

[env:nanoatmega328]
board = nanoatmega328new

[env:LGT8F328P]
platform = lgt8f
board = LGT8F328P